name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_ascent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_ascent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/open_ascent_test
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
      OPENAI_API_KEY: ci-placeholder-key
      OPENAI_MODEL: gpt-4o-mini
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PRO_PRICE_ID: price_ci_placeholder
      GUEST_TOKEN_SECRET: ci-only-guest-secret-not-used-outside-tests
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Create local Supabase Auth table stub
        run: >-
          psql -h localhost -U postgres -d open_ascent_test
          -c 'CREATE ROLE anon; CREATE ROLE authenticated;
          CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY);'
      - name: Apply migrations
        run: uv run --locked alembic upgrade head
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Full pytest suite
        run: uv run --locked pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Next.js route types
        run: pnpm --dir frontend exec next typegen
      - name: TypeScript
        run: pnpm --dir frontend exec tsc --noEmit
      - name: ESLint
        run: pnpm --dir frontend lint
      - name: Frontend analysis tests
        run: pnpm --dir frontend test:analysis
